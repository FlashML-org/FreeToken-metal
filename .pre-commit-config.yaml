repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        # Not .metal: most are metal_kernel bodies, which are not translation units, and the
        # {{NAME}} markers of the rest do not survive formatting. MLX formats only .h and .cpp too.
        files: \.(h|cpp|mm)$
