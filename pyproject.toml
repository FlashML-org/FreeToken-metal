[build-system]
requires = ["setuptools>=75", "cmake>=3.27", "nanobind==3.0.1", "mlx==0.32.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ftmetal"
version = "0.0.1"
description = "LLM serving engine for Apple Silicon on MLX and Metal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "mlx==0.32.3",
    "numpy>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "tokenizers>=0.21,<1",
    "jinja2>=3.1,<4",
    "partial-json-parser>=0.2,<1",
    "openai>=2.0,<3",
    "pillow>=11.0,<13",
]

[project.scripts]
ftm = "ftmetal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mlx-lm>=0.31",
]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
