[build-system]
requires = ["setuptools==84.2.1", "cmake==4.4.4", "nanobind==3.0.1", "mlx==0.32.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ftmetal"
version = "0.0.1"
description = "LLM serving engine for Apple Silicon on MLX and Metal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mlx==0.32.3",
    "numpy>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "tokenizers==0.23.2",
    # Brought in by tokenizers, not imported; pinned because they move fast.
    "huggingface-hub==1.32.0",
    "hf-xet==1.6.0",
    "jinja2>=3.1,<4",
    "partial-json-parser>=0.2,<1",
    # responses_api.py imports openai.types.responses, which changes between releases.
    "openai==2.54.0",
    "pillow>=11.0,<13",
]

[project.scripts]
ftm = "ftmetal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    # The parity reference of tests/models, and the Hugging Face packages it brings in.
    "mlx-lm==0.31.3",
    "transformers==5.17.0",
    "safetensors==0.8.0",
]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"ftmetal.kernel" = ["**/*.metal", "**/*.h"]
"ftmetal.moe" = ["hot_experts/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
